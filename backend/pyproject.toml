[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "derivlab"
version = "0.1.0"
description = "Derivatives pricing library and research API"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8", "hypothesis>=6.100", "httpx>=0.27", "ruff>=0.6", "pyright>=1.1.380"]

[tool.hatch.build.targets.wheel]
packages = ["src/derivlab", "src/derivlab_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running convergence tests (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
# En dashes and middle dots are intentional in names like "Black–Scholes".
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
